name: Release

# A version tag such as v0.2.0 builds the installer and publishes a GitHub
# Release, which the docs Download page picks up on its own. The tag has to match
# the workspace version in Cargo.toml. A branch under release/ or a manual run
# goes through the same build but publishes nothing, and keeps the installer as
# a run artifact.
on:
  push:
    tags:
      - v*
    branches:
      - release/**
  workflow_dispatch:

permissions:
  contents: read

env:
  # ASIO stays out of published builds until its license is settled: Steinberg's
  # SDK allows distribution under GPLv3 or a signed agreement. Empty this once
  # one of those is in place. See packaging/README.md.
  ASIO_ARGS: --no-default-features

jobs:
  build:
    # Pinned because this image ships Inno Setup.
    runs-on: windows-2025
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      - id: version
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "amp-app") | .version')
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match workspace version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: >
          cargo test --release --locked ${{ env.ASIO_ARGS }}
          -p amp-dsp -p amp-engine -p amp-preset -p amp-tone3000

      # The subsystem is set here so the installed app opens no console window,
      # while `cargo run` keeps its log output.
      - run: >
          cargo rustc -p amp-app --release --locked --bin amp-gpui ${{ env.ASIO_ARGS }} --
          -C link-arg=/SUBSYSTEM:WINDOWS -C link-arg=/ENTRY:mainCRTStartup

      - run: >
          cargo about generate --workspace --locked ${{ env.ASIO_ARGS }}
          --config packaging/about.toml
          --output-file target/release/THIRD-PARTY-LICENSES.html
          packaging/about.hbs

      - run: iscc /DAppVersion=${{ steps.version.outputs.version }} /O..\dist packaging\amp-gpui.iss

      - shell: bash
        working-directory: dist
        run: sha256sum amp-gpui-setup.exe > amp-gpui-setup.exe.sha256

      - uses: actions/upload-artifact@v5
        with:
          name: installer
          path: dist/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: installer
          path: dist
      # A version with a suffix, such as 0.2.0-beta.1, is marked as a prerelease.
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          flags=()
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --generate-notes --title "Amp GPUI $VERSION" "${flags[@]}"
