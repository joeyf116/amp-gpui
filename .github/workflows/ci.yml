# Checks every pull request and push to main. ASIO stays off here, since it needs
# LLVM and the Steinberg SDK, and the release workflow builds it.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --no-default-features --locked -- -D warnings
      - run: cargo test --workspace --no-default-features --locked
