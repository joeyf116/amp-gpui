name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - zensical.toml
      - .github/workflows/docs.yml
      - tools/tone-generator/**
      # The tone generator's catalog is copied from these.
      - crates/amp-dsp/src/block.rs
      - crates/amp-preset/src/preset.rs
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer push replaces a deploy that hasn't finished.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: python tools/tone-generator/sync_catalog.py --check
      # Zensical is pre-1.0, so the version moves on purpose, not by surprise.
      - run: pip install zensical==0.0.74
      - run: zensical build --clean --strict
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
