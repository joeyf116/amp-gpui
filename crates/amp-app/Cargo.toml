[package]
name = "amp-app"
description = "Guitar amp and effects rig with live monitoring, built on GPUI"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "amp-gpui"
path = "src/main.rs"

[features]
default = ["asio"]
asio = ["amp-engine/asio"]

[dependencies]
amp-dsp.workspace = true
amp-engine.workspace = true
amp-preset.workspace = true
amp-tone3000.workspace = true
directories.workspace = true
gpui-kit.workspace = true
serde.workspace = true
serde_json.workspace = true
